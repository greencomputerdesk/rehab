<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hip ceiling coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --sunk:#E3E8E0; --ink:#15233A; --muted:#566173; --line:#D3DACF;
  --pitch:#1F5A41; --pitch-ink:#FFFFFF;
  --green:#2B8A55; --amber:#B97F00; --red:#C33F37;
  --green-bg:#E2F2E8; --amber-bg:#FBF0D6; --red-bg:#F9E1DF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524; --surface:#152037; --sunk:#1B2842; --ink:#E7ECF2; --muted:#9BA7B8; --line:#26344F;
    --pitch:#4FAE82; --pitch-ink:#07130D;
    --green:#4BC583; --amber:#EDB33A; --red:#F0675E;
    --green-bg:#173528; --amber-bg:#3A2E10; --red-bg:#3E1C1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#152037; --sunk:#1B2842; --ink:#E7ECF2; --muted:#9BA7B8; --line:#26344F;
  --pitch:#4FAE82; --pitch-ink:#07130D;
  --green:#4BC583; --amber:#EDB33A; --red:#F0675E;
  --green-bg:#173528; --amber-bg:#3A2E10; --red-bg:#3E1C1C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(88px + env(safe-area-inset-bottom,0px))}
.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
.top{padding:8px 0 4px}
.date{margin:0;font:700 34px/1.05 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.meta{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.chip{background:var(--pitch);color:var(--pitch-ink);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.since{color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.h{margin:0 0 4px;font:700 23px/1.15 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.muted{color:var(--muted)} .small{font-size:14px}
p{margin:6px 0}
.q{margin:18px 0 0}
.ql{margin:0 0 8px;font-weight:500}
.seg{display:flex;gap:6px}
.seg button,.scale button{flex:1 1 0;min-height:46px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;font:500 15px Barlow,Arial,sans-serif;padding:6px;cursor:pointer}
.seg button.on,.scale button.on{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.seg.sm button{min-height:38px;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{padding:0;font-weight:600}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.btn{display:block;width:100%;min-height:50px;margin-top:18px;border:0;border-radius:12px;background:var(--pitch);color:var(--pitch-ink);font:600 17px Barlow,Arial,sans-serif;cursor:pointer;padding:8px 12px}
.btn.ghost{background:transparent;color:var(--pitch);border:1.5px solid var(--pitch);margin-top:10px}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.link{background:none;border:0;color:var(--pitch);font:600 15px Barlow,Arial,sans-serif;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.center{display:block;margin:8px auto 0}
.light{border-radius:16px;padding:14px 16px;margin:14px 0;border-left:8px solid var(--line);color:var(--ink)}
.light.green{background:var(--green-bg);border-color:var(--green)}
.light.amber{background:var(--amber-bg);border-color:var(--amber)}
.light.red{background:var(--red-bg);border-color:var(--red)}
.light-row{display:flex;align-items:center;gap:10px}
.light h2{margin:0;flex:1;font:700 28px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none}
.dot.green,.green .dot{background:var(--green)}
.dot.amber,.amber .dot{background:var(--amber)}
.dot.red,.red .dot{background:var(--red)}
.banner{border-radius:16px;padding:14px 16px;margin:14px 0;background:var(--surface);border:2px solid var(--pitch)}
.banner.stop{background:var(--red-bg);border-color:var(--red)}
.banner .h{margin-bottom:2px}
.plan{margin:26px 0 8px}
.plan-title{margin:0 0 4px;font:700 42px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.sec{margin-top:22px;border-top:2px solid var(--ink);padding-top:10px}
.sec h3{margin:0;font:700 21px/1.2 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.items{list-style:none;margin:6px 0 0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;color:var(--ink);font:inherit;cursor:pointer}
.box{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;margin-top:1px;display:grid;place-items:center}
.item.on .box{background:var(--pitch);border-color:var(--pitch)}
.item.on .box::after{content:"";width:6px;height:11px;border:solid var(--pitch-ink);border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.item.on .txt{opacity:.55}
.txt b,.lk b{display:block;font-weight:600}
.txt span,.lk span{display:block;color:var(--muted);font-size:15px}
.locked{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);opacity:.55}
.locked .box{border-style:dashed}
select,textarea,input[type=date]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:16px Barlow,Arial,sans-serif;padding:8px 10px}
textarea{resize:vertical}
.field{display:block;margin:14px 0 0}
.field>span{display:block;font-weight:500;margin-bottom:6px}
.strip{list-style:none;padding:0;margin:10px 0 4px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.strip li{padding:10px 4px 6px;border-top:6px solid var(--line);font-size:13px;color:var(--muted);line-height:1.25}
.strip li.done{border-color:var(--pitch)}
.strip li.cur{border-color:var(--pitch);color:var(--ink);font-weight:600}
.strip b{display:block;font:700 22px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;margin-bottom:2px}
.gate{list-style:none;padding:0;margin:8px 0 0}
.gate li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.gate li.ok .mark{background:var(--green);border-color:var(--green);color:#fff}
.hist{list-style:none;padding:0;margin:0}
.hist li{padding:14px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dd{font-weight:600;flex:1}
.badge{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--sunk);margin-top:8px}
.badge.green{background:var(--green-bg)} .badge.amber{background:var(--amber-bg)} .badge.red,.badge.twinge{background:var(--red-bg)}
.tw{margin-top:8px}
.tw p{margin:0 0 6px;font-size:14px}
.plog{list-style:none;padding:0;margin:6px 0 0}
.plog li{padding:6px 0;font-size:15px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.ref summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font:700 21px/1.2 "Barlow Condensed","Arial Narrow",Arial,sans-serif;min-height:52px}
.ref summary::-webkit-details-marker{display:none}
.ref summary span:first-child{flex:1}
.ref summary::after{content:"+";font:600 22px/1 Barlow,Arial,sans-serif;color:var(--muted)}
.ref[open] summary::after{content:"–"}
.here{font:600 13px Barlow,Arial,sans-serif;background:var(--pitch);color:var(--pitch-ink);border-radius:999px;padding:3px 10px}
.ref-body{padding:0 16px 14px}
.ref-body h4{margin:16px 0 0;font:700 18px "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.ref-list{list-style:none;padding:0;margin:6px 0}
.ref-list li{padding:9px 0;border-bottom:1px solid var(--line)}
.ref-list b{display:block;font-weight:600}
.ref-list span{display:block;color:var(--muted);font-size:15px}
.ref-ol{margin:4px 0;padding-left:20px}
.ref-ol li{margin:6px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs button{flex:1;max-width:280px;min-height:58px;background:none;border:0;color:var(--muted);font:600 16px Barlow,Arial,sans-serif;cursor:pointer}
nav.tabs button.on{color:var(--pitch);box-shadow:inset 0 3px 0 var(--pitch)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--pitch);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){ .light{animation:in .25s ease-out} @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-act="tab" data-v="today" id="t-today">Today</button>
  <button type="button" data-act="tab" data-v="progress" id="t-progress">Progress</button>
  <button type="button" data-act="tab" data-v="plan" id="t-plan">Plan</button>
</nav>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parse(k){ var p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(k, n){ var d = parse(k); d.setDate(d.getDate()+n); return keyOf(d); }
function diff(a, b){ var x = a.split('-').map(Number), y = b.split('-').map(Number); return Math.round((Date.UTC(x[0],x[1]-1,x[2]) - Date.UTC(y[0],y[1]-1,y[2])) / 864e5); }
function nice(k, o){ return parse(k).toLocaleDateString(undefined, o || {weekday:'long', month:'long', day:'numeric'}); }
var TODAY = keyOf(new Date());

var PH = {1:'Foundations', 2:'Build intensity', 3:'Max effort', 4:'Game-like'};
var ACT = {
  soccer:'Soccer', A_str:'Session A + heavy strength', B_run:'Session B + easy run', A_run:'Session A + easy run',
  A:'Session A only', B:'Session B only', str:'Heavy strength only', light:'Light / isometric session',
  run:'Easy run', rest:'Rest', recovery:'Recovery day', other:'Something else', unknown:'Don’t remember'
};
var ACT_ORDER = ['soccer','A_str','B_run','A_run','A','B','str','light','run','rest','recovery','other','unknown'];
var TITLE = {
  soccer:'Soccer day', soccer_or_rest:'Soccer day, or rest', A_str:'Session A, then heavy strength',
  A_run:'Session A, then an easy run', B_run:'Session B, then an easy run', str:'Heavy strength only',
  light:'Light / isometric session', run:'Easy run', rest:'Rest day', recovery:'Recovery day'
};
function hasA(a){ return a === 'A_str' || a === 'A_run' || a === 'A'; }
function hasB(a){ return a === 'B_run' || a === 'B'; }

function EMPTY(){ return {v:1, startDate:null, phase:1, phaseStart:null, phaseDir:0, physioOK:false, phaseLog:[], days:{}, updatedAt:0}; }
var state = EMPTY();
var tab = 'today', draft = null, redo = false, resetArm = false, saveMode = 'device';

/* ---------- storage ---------- */
var LS = 'hip-ceiling-coach-v1';
try { var raw = localStorage.getItem(LS); if (raw) state = Object.assign(EMPTY(), JSON.parse(raw)); } catch (e) {}
var dbRef = null, writing = false, again = false, timer = null;
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
function save(){
  state.updatedAt = Date.now();
  saveLocal();
  if (dbRef){ clearTimeout(timer); timer = setTimeout(flush, 500); }
}
function flush(){
  if (!dbRef) return;
  if (writing){ again = true; return; }
  writing = true;
  dbRef.set(JSON.parse(JSON.stringify(state))).catch(function(e){
    if (e && e.code === 'unavailable') setTimeout(flush, 1500 + Math.random()*1000);
  }).then(function(){ writing = false; if (again){ again = false; flush(); } });
}
function adopt(remote){ state = Object.assign(EMPTY(), JSON.parse(JSON.stringify(remote))); saveLocal(); }
(function connect(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
    var db = r[0], user = r[1];
    if (!db || !user) return;
    return user.id().then(function(uid){
      if (!uid) return;
      var ref = db.doc('data/users/' + uid + '/coach');
      return ref.get().then(function(snap){
        dbRef = ref; saveMode = 'account';
        if (snap.exists){
          var rem = snap.data();
          if ((rem.updatedAt || 0) >= (state.updatedAt || 0)) adopt(rem); else flush();
        } else if (state.startDate){ flush(); }
        render();
        ref.onSnapshot(function(s){
          if (!s.exists || s.metadata.hasPendingWrites) return;
          var d = s.data();
          if ((d.updatedAt || 0) > (state.updatedAt || 0)){ adopt(d); render(); }
        }, function(){});
      });
    });
  }).catch(function(){});
})();

/* ---------- logic ---------- */
function day(k){ return state.days[k] || (state.days[k] = {}); }
function sessionResult(k){
  var d = state.days[k]; if (!d) return null;
  if (d.twinge) return 'twinge';
  var n = state.days[addDays(k,1)];
  return (n && n.morning && n.morning.light) || 'pending';
}
function counts(){
  var p = state.phase, s = state.phaseStart || '0000-00-00', a = 0, b = 0, stk = 0;
  Object.keys(state.days).forEach(function(k){
    var d = state.days[k];
    if (k < s || d.phase !== p) return;
    if (sessionResult(k) !== 'green') return;
    if (hasA(d.activity)) a++;
    if (hasB(d.activity)){ b++; if (d.stacked) stk++; }
  });
  return {a:a, b:b, stk:stk};
}
function gate(){
  var c = counts(), p = state.phase;
  var items = [
    {t:'Session A, green', have:Math.min(c.a,2), need:2, ok:c.a >= 2},
    {t:'Session B, green', have:Math.min(c.b,2), need:2, ok:c.b >= 2}
  ];
  if (p === 2) items.push({t:'Physio has okayed full-speed sprints and full-power shots', ok:!!state.physioOK});
  if (p === 3) items.push({t:'Sprint into a shot at 100%, green', have:Math.min(c.stk,2), need:2, ok:c.stk >= 2});
  return {items:items, ready:items.every(function(i){ return i.ok; }), c:c};
}
function justMovedUp(){
  if (state.phaseDir !== 1 || !state.phaseStart || diff(TODAY, state.phaseStart) > 10) return false;
  var c = counts(); return c.a + c.b === 0;
}
function lastSoccer(){
  var best = null;
  Object.keys(state.days).forEach(function(k){ if (state.days[k].activity === 'soccer' && k <= TODAY && (!best || k > best)) best = k; });
  return best;
}
function soccerWasRed(ls){ var n = ls && state.days[addDays(ls,1)]; return !!(n && n.morning && n.morning.light === 'red'); }
function planType(){
  var d = state.days[TODAY] || {}, m = d.morning;
  if (m && m.light === 'red') return 'recovery';
  if (d.planOverride) return d.planOverride;
  var ls = lastSoccer(); if (!ls) return 'soccer_or_rest';
  var cyc = diff(TODAY, ls), red = soccerWasRed(ls);
  var map = {0:'soccer', 1:'rest', 2:red ? 'str' : 'A_str', 3:'rest', 4:red ? 'A_run' : 'B_run', 5:'light', 6:'rest'};
  return map[cyc] || 'soccer_or_rest';
}
function lightOf(m, prev){
  if (m.squeeze >= 3 || m.daily) return 'red';
  if (prev != null && m.squeeze >= 2 && m.squeeze > prev) return 'red';
  if (m.squeeze === 2 || m.bridge === 'worse' || m.knee === 'worse' || m.weaker) return 'amber';
  return 'green';
}

/* ---------- session content ---------- */
var WARM = [
  ['Jog, 3 min','Easy jog, side shuffles, backpedal'],
  ['Groin and hip, 3 min','Copenhagen hold, knee supported: 2 × 15 s per side. Pillow squeeze: 2 × 5 s. Band knee drives: 8 per side'],
  ['Range, 3 min','Walking lunges with a twist, side lunges, leg swings'],
  ['Drills, 3 min','March, skip and carioca, 10 m each, slowly'],
  ['Build-ups, 3 min','Three 40 m runs at about 60%, 70%, then 80%']
];
var CORE = [['Reverse crunch','12'],['Dead bug','10 per side'],['Pallof press','10 per side']];
var LEGS = [['Split squat','8 per side'],['Reverse lunge','8 per side'],['Step-up','8 per side'],['Single-leg glute bridge','10 per side']];
var LAT = [['Banded lateral walk','15 steps each way'],['Clamshell','15 per side'],['Monster walk','15 steps each way']];
function week(){ return Math.max(0, Math.floor(diff(TODAY, state.startDate || TODAY) / 7)); }
function pick(arr){ return arr[week() % arr.length]; }
function sessA(p, c){
  if (p === 1) return [['Short sprints','5 × 15 m at 80%, walk back'],['Strides','4 × 60–80 m at 75–80%, relaxed'],['Pogo hops','3 × 15, small and quick'],['Squat jump, land and hold','3 × 5'],['Side-to-side line hops','2 × 10, small']];
  if (p === 2) return [['Short sprints','6 × 20 m at 85–90%, 2 min rest'],['Flying sprints','Build up over 20 m, then 20 m at 85–90%. 3–4 reps, 3 min rest'],['Side bounds, land and hold','3 × 4 per side'],['Single-leg hop forward, land and hold','3 × 5 per side, right leg last'],['Split-squat jumps','2 × 4 per side']];
  if (p === 3) return [
    ['Flying sprints', c.a >= 1 ? 'Build up over 20 m, then 20 m fast: 2 at 95%, then 2 at 100%. 3–4 min rest' : 'Build up over 20 m, then 20 m at 95%: 4 reps, 3–4 min rest. 100% unlocks after one green Session A'],
    ['Short sprints', c.a >= 1 ? '4 × 20 m at 95–100%, 3 min rest' : '4 × 20 m at 95%, 3 min rest'],
    ['Side bounds, continuous','3 × 3 per side'],
    ['Single-leg hops, forward and sideways','Land and hold: 2 × 4 per side']];
  return [['Reaction starts','Partner shouts “go” or drops a ball: sprint 15–20 m at max. 4–6 reps'],['Reaction cuts','Partner points left or right during a 10 m run-in: 2 × 4'],['Repeated sprints','6 × 20 m at 90–95%, 30 s rest. One set only']];
}
function sessB(p, c){
  if (p === 1) return [['Stops','Run 10 m at half speed, stop within 3 steps: 2 × 4. Then at 70%: 2 × 3'],['Side shuffle into a stop','2 × 3 each way'],['Passing','30 inside-foot passes, 10–25 m'],['Driven passes','15 with the laces, 20–30 m, about 60% power. No shots yet']];
  if (p === 2) return [['Stops','From 80–90%, within 4–5 steps: 2 × 3'],['Cuts at 45°','At 75–80%: 2 × 3 each way'],['Long passes','10 at 30–40 m, about 75% power'],['Shots','10–12 at 70–80% power, still ball, short run-up']];
  if (p === 3){
    var n = Math.min(10, 4 + 2 * c.b);
    var l = [['Sprint, then stop','At 90–100%: 2 × 3'],['Sharp 90° cuts','At 85–90%: 2 × 3 each way'],['Shots at 90%','6–8'],['Full-power shots', n + ' today' + (n < 10 ? ' (2 more after each green Session B, up to 10)' : '')],['Shots off a rolled or passed ball','6']];
    if (c.a >= 1 && c.b >= 1) l.push(['Sprint into a shot','15–20 m straight into a shot: 3–5 reps, full rest between. Start at 90%; go to 100% once that’s been green']);
    else l.push(['Sprint into a shot','Unlocks after one green Session A and one green Session B in this phase', true]);
    return l;
  }
  return [['First-time shots','8–10 off varied passes from a partner: on the ground, bouncing, from wide'],['Stop, turn, shoot','Run, stop, turn and shoot at 90–100%: 4–6'],['Tired shooting','Two 40 m shuttles, then 2 shots at 90%. Repeat 3 times']];
}
function strength(){
  var lg = pick(LEGS), co = pick(CORE), la = pick(LAT);
  return [
    ['Copenhagen dips', justMovedUp() ? '2 × 10 per side. Cut back because you just moved up a phase' : '3 × 12–15 per side'],
    [lg[0], '3 × ' + lg[1]],
    [co[0], '3 × ' + co[1]],
    [la[0], '2 × ' + la[1]],
    ['Band knee drive','3 × 8 per side, 2 s hold at the top']
  ];
}
function lightSession(){
  var co = pick(CORE), la = pick(LAT);
  return [['Copenhagen holds','Your usual isometric holds, both sides'],[co[0], '2 × ' + co[1]],[la[0], '2 × ' + la[1]],['Hip flexor hold','3 × 30 s per side, knee up against a band']];
}
function soccerItems(){
  var p = state.phase, done = p === 4 && gate().ready, l = [];
  if (p <= 3) l.push(['Keep it casual','Training or casual play only. No full-power shots, no all-out races for the ball']);
  else if (!done) l.push(['Full scrimmages are fine','League games wait until Phase 4 has gone green twice']);
  else l.push(['Full soccer, league games included','Your ceiling work is done']);

  state.phase += 1; state.phaseStart = TODAY; state.phaseDir = 1;
  state.phaseLog.push({date:TODAY, to:state.phase, why:'Gate passed'});
  var d = state.days[TODAY]; if (d && !d.activity) d.phase = state.phase;
  save(); render(); window.scrollTo(0, 0);
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.dataset.act, v = el.dataset.v, k = el.dataset.d;
  if (a !== 'reset') resetArm = false;
  if (a === 'tab'){ tab = v; render(); window.scrollTo(0, 0); return; }
  if (a === 'draft'){ var f = el.dataset.f; draft[f] = f === 'squeeze' ? Number(v) : v === 'true' ? true : v === 'false' ? false : v; render(); return; }
  if (a === 'saveCheck') return saveCheck();
  if (a === 'redo'){ redo = true; draft = null; render(); return; }
  if (a === 'cancelRedo'){ redo = false; draft = null; render(); return; }
  if (a === 'moveUp') return moveUp();
  if (a === 'done'){ var d = day(TODAY), list = d.done || (d.done = []), i = list.indexOf(v); if (i >= 0) list.splice(i, 1); else list.push(v); save(); render(); return; }
  if (a === 'setTw'){ day(k).twinge = v === 'true'; save(); render(); return; }
  if (a === 'setStk'){ day(k).stacked = v === 'true'; save(); render(); return; }
  if (a === 'physio'){ state.physioOK = v === 'true'; save(); render(); return; }
  if (a === 'logPlan'){ return setAct(TODAY, planType()); }
  if (a === 'start'){
    var ph = Number($('#su-phase').value), ls = $('#su-soccer').value, ok = $('#su-physio').value === 'yes';
    state = EMPTY(); state.startDate = TODAY; state.phase = ph; state.phaseStart = TODAY; state.physioOK = ok;
    state.phaseLog = [{date:TODAY, to:ph, why:'Started'}];
    if (ls && ls <= TODAY) state.days[ls] = {activity:'soccer', phase:ph};
    save(); render(); return;
  }
  if (a === 'reset'){
    if (!resetArm){ resetArm = true; render(); return; }
    resetArm = false; state = EMPTY(); draft = null; redo = false; tab = 'today'; save(); render(); return;
  }
});
document.addEventListener('change', function(e){
  var el = e.target.closest('[data-chg]'); if (!el) return;
  var c = el.dataset.chg;
  if (c === 'act') return setAct(el.dataset.d, el.value);
  if (c === 'override'){ var d = day(TODAY); if (el.value) d.planOverride = el.value; else delete d.planOverride; d.done = []; save(); render(); return; }
  if (c === 'notes'){ day(TODAY).notes = el.value; save(); return; }
  if (c === 'phase'){
    var n = Number(el.value); if (n === state.phase) return;
    state.phaseDir = n > state.phase ? 1 : -1; state.phase = n; state.phaseStart = TODAY;
    state.phaseLog.push({date:TODAY, to:n, why:'Changed manually'});
    save(); render(); return;
  }
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden && keyOf(new Date()) !== TODAY){ draft = null; redo = false; render(); } });
render();
})();
</script>
